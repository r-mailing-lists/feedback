# The taxonomy. This file is the source for every label create and update.
# It is not a mirror: a label added or renamed in the GitHub UI is invisible
# here and survives every sync, so make label changes in this file.
#
# Prefixes: t: type, a: area, p: priority, s: status, c: community.

# Type: what kind of report this is. Set by the issue form.
- name: "t:bug"
  color: "d73a4a"
  description: "The site is not working"
- name: "t:archive-issue"
  color: "e99695"
  description: "Archived content is missing, wrong, or garbled"
- name: "t:feature-request"
  color: "a2eeef"
  description: "New feature suggestion"
- name: "t:list-request"
  color: "c2e0c6"
  description: "A mailing list we should be mirroring"
- name: "t:documentation"
  color: "0075ca"
  description: "Documentation related"
- name: "t:question"
  color: "cc317c"
  description: "Question from the community"

# Area: the domain, not the repo. Several domains are served by more than one
# repo. Set by hand at triage, one per issue.
- name: "a:site"
  color: "bfd4f2"
  description: "Site chrome, navigation, performance"
- name: "a:search"
  color: "bfd4f2"
  description: "Full text search and its results"
- name: "a:threading"
  color: "bfd4f2"
  description: "How replies are grouped into threads"
- name: "a:parsing"
  color: "bfd4f2"
  description: "mbox parsing: bodies, headers, encodings, attachments"
- name: "a:ingestion"
  color: "bfd4f2"
  description: "Fetching from upstream pipermail, and the daily refresh"
- name: "a:data"
  color: "bfd4f2"
  description: "The published Parquet and the raw archives"
- name: "a:list-page"
  color: "bfd4f2"
  description: "Per-list overview, monthly, and date views"
- name: "a:message-page"
  color: "bfd4f2"
  description: "The single message and thread detail views"
- name: "a:contributors"
  color: "bfd4f2"
  description: "Author pages, identity merging, and contributor stats"
- name: "a:infra"
  color: "bfd4f2"
  description: "Pipelines, CI, deploys, and publishing. Use for staleness"

# Priority. Set by hand at triage.
- name: "p:high"
  color: "b60205"
  description: "High priority"
- name: "p:medium"
  color: "fbca04"
  description: "Medium priority"
- name: "p:low"
  color: "0e8a16"
  description: "Low priority"

# Status. s:needs-triage is set by the issue form; the rest by hand.
- name: "s:needs-triage"
  color: "fbca04"
  description: "Awaiting triage"
- name: "s:needs-info"
  color: "d4c5f9"
  description: "More info needed from reporter"
- name: "s:in-progress"
  color: "0e8a16"
  description: "Being worked on"
- name: "s:blocked"
  color: "b60205"
  description: "Blocked by something else"
- name: "s:upstream"
  color: "e4e669"
  description: "Present in the upstream pipermail archive, so it cannot be fixed here"
- name: "s:duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue"
- name: "s:wontfix"
  color: "cfd3d7"
  description: "Will not be addressed"
- name: "s:invalid"
  color: "cfd3d7"
  description: "Not a real issue, spam, or off topic"

# Community.
- name: "c:good-first-issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "c:help-wanted"
  color: "008672"
  description: "Help is wanted"
