name: Sync labels

on:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout, to read labels.yml
      issues: write    # the label endpoints are gated on the Issues scope
    steps:
      - uses: actions/checkout@v4

      - name: Apply labels.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          yq -o=json '.' .github/labels.yml | jq -c '.[]' | while read -r label; do
            name=$(jq -r '.name' <<<"$label")
            color=$(jq -r '.color' <<<"$label")
            desc=$(jq -r '.description' <<<"$label")
            echo "syncing ${name}"
            gh label create "$name" --color "$color" --description "$desc" --force
          done
